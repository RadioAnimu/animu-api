# Jenkinsfile.sonar supplies the host URL and token at runtime.
sonar.projectKey=RadioAnimu_animu-api
sonar.projectName=animu-api
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/build/**,**/.build/**,**/generated/**,ios/Tests/**,ios/Package.swift,src/**/__tests__/**
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
